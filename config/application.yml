# 本服务运行时配置（敏感项写在 application.local.yml，勿提交仓库）

report_writing:
  data_home: data
  llm_mode: bailian
  database:
    mode: auto
    jdbc_url: ""
  document_parse:
    mode: rag
    log_chunk: 6000
  redis:
    url: ""
  chat_control:
    model_name: ""
    max_tokens: 1536
    react_rounds: 5
    dialogue_turns: 6
  intent:
    max_tokens: 768
  features:
    reply_polish: true
    chain_debug: false
    blueprint_match_llm: false
    scripted_chat: false
    # 口语 JSON 计划短路（高置信串行）；false 时 ReAct 总控 + 澄清/UI 确定性路径（推荐）
    intent_plan: false
    # 意图分类器 system 是否附带工具含义表（false 时只列 tool id，语义靠 @tool description）
    intent_tool_catalog_in_prompt: false
  outline:
    multiround: true
    toc_max_chars: 250000
    chapter_scan_max_chars: 80000
    prefer_local_docx: true
    try_rag_html: true

spring:
  datasource:
    druid:
      master:
        url: ""
        username: ""
        password: ""

suiyue:
  rag:
    domain: http://8.130.53.248:8889
  file:
    domain: https://images.smartqa.cn
